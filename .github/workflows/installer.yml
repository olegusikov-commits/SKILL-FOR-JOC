name: installer

on:
  push:
    paths:
      - install.cmd
      - uninstall.cmd
      - kit/**
      - tests/test-install.ps1
      - .github/workflows/installer.yml
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: install.cmd cases (a)-(e)
        shell: pwsh
        run: ./tests/test-install.ps1
